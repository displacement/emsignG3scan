name: Release

# Push a tag like v0.1.0 to build binaries for every platform and publish a
# GitHub Release.  (Workflow can also be run by hand to test the build matrix;
# manual runs build and upload artifacts but do not publish a release.)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BIN: emsignG3scan

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl,  os: ubuntu-latest,    archive: tar.gz, run_tests: true  }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, archive: tar.gz, run_tests: true  }
          - { target: aarch64-apple-darwin,       os: macos-latest,     archive: tar.gz, run_tests: true  }
          # Intel Mac binary cross-compiled on the Apple Silicon runner.
          - { target: x86_64-apple-darwin,        os: macos-latest,     archive: tar.gz, run_tests: false }
          - { target: x86_64-pc-windows-msvc,     os: windows-latest,   archive: zip,    run_tests: true  }
          - { target: aarch64-pc-windows-msvc,    os: windows-latest,   archive: zip,    run_tests: false }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Test
        if: matrix.run_tests
        run: cargo test --locked --release --target ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Smoke test
        if: matrix.run_tests
        shell: bash
        run: |
          EXE="target/${{ matrix.target }}/release/${BIN}"
          [ "${{ matrix.archive }}" = zip ] && EXE="${EXE}.exe"
          "$EXE" --verify

      - name: Package
        id: package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          NAME="${BIN}-${VERSION}-${{ matrix.target }}"
          mkdir "$NAME"
          cp LICENSE README.md "$NAME/"
          if [ "${{ matrix.archive }}" = zip ]; then
            cp "target/${{ matrix.target }}/release/${BIN}.exe" "$NAME/"
            7z a -tzip "${NAME}.zip" "$NAME" > /dev/null
            echo "file=${NAME}.zip" >> "$GITHUB_OUTPUT"
          else
            cp "target/${{ matrix.target }}/release/${BIN}" "$NAME/"
            tar czf "${NAME}.tar.gz" "$NAME"
            echo "file=${NAME}.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error

  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Cargo.toml version
        run: |
          CARGO_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "v${CARGO_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${CARGO_VERSION}"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
